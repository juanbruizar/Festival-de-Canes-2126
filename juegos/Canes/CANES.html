<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>Canes Mundana</title>
<style>
:root{--black:#080808;--white:#f4f4f4;--gray:#8b8b8b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif}
body{user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:var(--white);touch-action:none}
#start{position:fixed;inset:0;z-index:2;background:var(--black);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.start-inner{padding:30px 22px;max-width:650px}
h1{font-weight:750;font-size:clamp(48px,10vw,112px);line-height:.82;letter-spacing:-.075em;margin:0;color:var(--white)}
.subtitle{margin:28px 0 46px;font-size:13px;letter-spacing:.12em;color:var(--gray)}
.prompt{display:inline-flex;align-items:center;gap:12px;color:var(--white);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.prompt:before{content:"";width:24px;height:24px;border:1px solid var(--gray);border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 7px var(--black),inset 0 0 0 8px var(--white)}
#start.hidden{display:none}
@media(max-height:520px){h1{font-size:clamp(44px,11vh,76px)}.subtitle{margin:18px 0 24px}}
</style>
</head>

function drawSky(){ctx.fillStyle=TONES.white;ctx.fillRect(0,0,W,H);circle(W*.77,H*.18,Math.max(22,H*.045),TONES.gray,TONES.black,2);for(let i=0;i<5;i++){const span=W+200;let x=((i*W*.31-camera*.09+150)%span+span)%span-80;drawCloud(x,H*(.13+(i%3)*.075),.65+(i%2)*.19)}}
function buildingLayer(parallax,far){const spacing=far?H*.48:H*.41,origin=cityStart-(far?H*.72:H*.24),viewLeft=camera*parallax;const first=Math.floor((viewLeft-origin)/spacing)-2,lastN=first+Math.ceil(W/spacing)+7,base=ground+(far?H*.012:0);
 for(let n=first;n<lastN;n++){let wx=origin+n*spacing+(rand(n+12)-.5)*spacing*.25;const w=(far?H*.27:H*.30)+rand(n+3)*H*.22,h=(far?H*.14:H*.19)+rand(n+8)*H*(far?.2:.33),x=wx-camera*parallax,y=base-h;if(x+w<-80||x>W+80||wx<cityStart-H*1.9)continue;
  ctx.fillStyle=C.gray;ctx.fillRect(x,y,w,h);ctx.strokeStyle=C.black;ctx.lineWidth=far?1.5:2;ctx.strokeRect(x,y,w,h);
  if(rand(n+31)>.52){ctx.fillStyle=C.black;ctx.fillRect(x+w*.13,y-7,w*.74,7);ctx.fillStyle=C.gray;ctx.fillRect(x+w*.19,y-17,w*.62,10);ctx.strokeRect(x+w*.19,y-17,w*.62,10)}
  const cols=Math.max(2,Math.floor(w/(H*.065))),rows=Math.max(2,Math.floor(h/(H*.075)));for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){if(rand(n*13+row*7+col*3)>.79)continue;const winW=Math.min(H*.026,w/(cols+1)*.48),winH=Math.min(H*.034,h/(rows+1)*.48),wx2=x+w*(col+1)/(cols+1)-winW/2,wy=y+h*(row+1)/(rows+1)-winH/2;ctx.fillStyle=(row+col+n)%3===0?C.black:C.white;ctx.fillRect(wx2,wy,winW,winH);ctx.strokeStyle=C.black;ctx.lineWidth=1;ctx.strokeRect(wx2,wy,winW,winH);}

 }}
function drawCityGround(){const start=0;ctx.fillStyle=TONES.gray;ctx.fillRect(start,ground,W,H-ground);ctx.fillStyle=TONES.white;ctx.fillRect(start,ground,W,4);const roadY=ground+H*.095;ctx.fillStyle=TONES.black;ctx.fillRect(start,roadY,W,H-roadY);ctx.fillStyle=TONES.gray;ctx.fillRect(start,roadY,W,3);const step=Math.max(110,H*.2),off=camera%step;ctx.fillStyle=TONES.gray;for(let x=-off;x<W;x+=step)ctx.fillRect(x,roadY+H*.13,step*.39,3);}
function drawCitySign(){const x=H*.72-camera;if(x<-70||x>W+70)return;const y=ground-H*.32;ctx.strokeStyle=C.black;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+26);ctx.lineTo(x,ground);ctx.stroke();ctx.fillStyle=C.white;ctx.fillRect(x-55,y-4,110,31);ctx.strokeRect(x-55,y-4,110,31);ctx.fillStyle=C.black;ctx.font=`700 ${Math.max(9,H*.015)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('AVENIDA',x,y+11);}
function drawCity(){buildingLayer(.37,true);buildingLayer(.76,false);drawCityGround();drawCitySign();
 // streetlamps along the blocks
 const step=H*.72,startN=Math.floor((camera* .76-cityStart)/step)-2;for(let n=startN;n<startN+Math.ceil(W/step)+5;n++){const wx=cityStart+n*step+H*.25,x=wx-camera*.76;if(x<-50||x>W+50||wx<cityStart-H*.3)continue;ctx.strokeStyle=C.black;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x,ground-H*.28);ctx.quadraticCurveTo(x,ground-H*.31,x+H*.045,ground-H*.31);ctx.lineTo(x+H*.075,ground-H*.31);ctx.stroke();ctx.fillStyle=C.white;ctx.fillRect(x+H*.05,ground-H*.325,H*.04,H*.021);ctx.strokeRect(x+H*.05,ground-H*.325,H*.04,H*.021);}}
function flightAmount(){return smooth(takeoffX,takeoffX+H*.58,player.x)}
function flightBaseY(){const fly=flightAmount(),bob=fly?Math.sin(elapsed*3.2)*H*.012:0;return ground-radius-fly*H*.34-bob}
function drawBall(){const fly=flightAmount(),baseY=flightBaseY(),x=player.x-camera,y=Math.max(radius+10,baseY+player.airY);const shadowScale=1-fly*.72;ctx.fillStyle=C.black;ctx.beginPath();ctx.ellipse(x,ground+2,Math.max(7,radius*.8*shadowScale),Math.max(2,radius*.16*shadowScale),0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(x,y);ctx.rotate(player.rot*player.facing);ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.clip();if(sprite.complete&&sprite.naturalWidth)ctx.drawImage(ball,-radius,-radius,radius*2,radius*2);else{ctx.fillStyle=C.gray;ctx.fill();ctx.strokeStyle=C.black;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-radius,-8);ctx.quadraticCurveTo(0,7,radius,-9);ctx.stroke();ctx.fillStyle=C.white;ctx.beginPath();ctx.ellipse(-radius*.25,-radius*.4,radius*.27,radius*.5,-.3,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.strokeStyle=C.black;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.stroke();}
function render(){if(!W||!H)return;ctx.clearRect(0,0,W,H);drawSky();drawCity();drawBall();}
function playPad(freq,when,level,duration){const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,when);gain.gain.setValueAtTime(.0001,when);gain.gain.linearRampToValueAtTime(level,when+1.1);gain.gain.setValueAtTime(level,when+duration*.72);gain.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(gain);gain.connect(musicMaster);osc.start(when);osc.stop(when+duration+.04)}
function playPluck(freq,when,level){const osc=audioContext.createOscillator(),harm=audioContext.createOscillator(),gain=audioContext.createGain(),mix=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,when);harm.type='triangle';harm.frequency.setValueAtTime(freq*2,when);mix.gain.value=.13;gain.gain.setValueAtTime(.0001,when);gain.gain.linearRampToValueAtTime(level,when+.025);gain.gain.exponentialRampToValueAtTime(level*.22,when+.45);gain.gain.exponentialRampToValueAtTime(.0001,when+2.4);osc.connect(gain);harm.connect(mix);mix.connect(gain);gain.connect(musicMaster);osc.start(when);harm.start(when);osc.stop(when+2.45);harm.stop(when+2.45)}
function scheduleMusicStep(){const bar=Math.floor(musicStep/4)%musicChords.length,beat=musicStep%4,when=musicNext;if(beat===0){const chord=musicChords[bar],dur=musicBeat*4.25;playPad(chord[0],when,.024,dur);playPad(chord[1],when,.012,dur);playPad(chord[2],when,.009,dur);playPad(chord[3],when,.006,dur)}const note=musicMelody[musicStep%musicMelody.length];if(note)playPluck(note,when,.035);musicStep++;musicNext+=musicBeat;}
function startMusic(){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;try{if(!audioContext){audioContext=new Audio();musicMaster=audioContext.createGain();musicMaster.gain.value=.5;musicMaster.connect(audioContext.destination)}audioContext.resume();musicNext=audioContext.currentTime+.22;musicStep=0;if(musicTimer)clearInterval(musicTimer);const tick=()=>{if(!audioContext||audioContext.state!=='running')return;if(musicNext<audioContext.currentTime-.25)musicNext=audioContext.currentTime+.08;while(musicNext<audioContext.currentTime+1.15)scheduleMusicStep()};tick();musicTimer=setInterval(tick,140)}catch(err){console.warn('No se pudo iniciar la música',err)}}
function start(){if(playing)return;playing=true;startMusic();cover.classList.add('hidden');document.body.style.cursor='none';last=performance.now();requestAnimationFrame(loop)}
function loop(now){if(!playing)return;const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;elapsed+=dt;const right=held.right?1:0,left=held.left?1:0;let target=102+right*165-left*185;if(left&&right)target=102;player.v+=(target-player.v)*(1-Math.exp(-3.8*dt));player.x=Math.max(radius+12,player.x+player.v*dt);if(player.v!==0){player.facing=player.v<0?-1:1;player.rot+=player.v*dt/radius;}
  if(player.x>takeoffX){const vertical=(held.down?1:0)-(held.up?1:0),vyTarget=vertical*H*.42;player.airV+=(vyTarget-player.airV)*(1-Math.exp(-6*dt));player.airY+=player.airV*dt;const baseY=flightBaseY(),minAir=radius+12-baseY,maxAir=ground-radius-baseY;player.airY=Math.max(minAir,Math.min(maxAir,player.airY));if(player.airY===minAir||player.airY===maxAir)player.airV=0;}else{player.airY=0;player.airV=0;}
  camera=Math.max(0,player.x-W*.34);render();requestAnimationFrame(loop)}
function setKey(e,on){if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')held.left=on;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')held.right=on;if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')held.up=on;if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')held.down=on;}
window.addEventListener('keydown',e=>{if(!playing){start();return}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','A','d','D','w','W','s','S',' '].includes(e.key))e.preventDefault();setKey(e,true)});window.addEventListener('keyup',e=>setKey(e,false));window.addEventListener('blur',()=>{held.left=held.right=held.up=held.down=false});
cover.addEventListener('pointerdown',start);cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}});
canvas.addEventListener('pointerdown',e=>{if(!playing)return;touchOrigin={x:e.clientX,y:e.clientY};held[e.clientX<W*.5?'left':'right']=true;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!playing||!touchOrigin)return;const dx=e.clientX-touchOrigin.x,dy=e.clientY-touchOrigin.y;if(Math.abs(dx)>18||Math.abs(dy)>18){held.left=dx<-18;held.right=dx>18;held.up=dy<-18;held.down=dy>18;}});for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>{held.left=held.right=held.up=held.down=false;touchOrigin=null});
